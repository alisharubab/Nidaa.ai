<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nidaa-AI — Dispatcher Console</title>

  <!-- Fonts: self-host under dashboard/fonts/ before the offline demo (docs/UI-UX-REQUIREMENTS.md 3.1) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet" />

  <!-- Leaflet from CDN, zero build step (docs/TRD.md section 7) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">

    <!-- Header, 72px (UI-UX §5.1) -->
    <header class="header">
      <div class="brand">
        <span class="brand-mark">nidaa<span class="brand-dot"></span>ai</span>
      </div>

      <div class="header-ttt">
        <div class="ttt-label-group">
          <span class="ttt-label">Time to Triage</span>
          <!-- TODO(FE-08): replace with the thin 3px arc per UI-UX §1.3 -->
          <span class="ttt-value" id="ttt-summary">median <strong>—</strong> · p95 <strong>—</strong> · baseline <strong>—</strong></span>
        </div>
      </div>

      <div class="live-indicator" id="live-indicator" aria-live="polite">
        <span class="live-dot" id="live-dot"></span>
        <span id="live-text">live</span>
      </div>
    </header>

    <!-- Left rail, 260px -->
    <aside class="rail-left">
      <div>
        <div class="rail-section-title">Queues</div>
        <nav id="queue-list">
          <button class="queue-item active" data-filter="all">
            <span>All</span><span class="queue-count" id="count-all">0</span>
          </button>
          <button class="queue-item" data-filter="critical">
            <span>Critical</span><span class="queue-count" id="count-critical">0</span>
          </button>
          <button class="queue-item" data-filter="unlocated">
            <span>Unlocated</span><span class="queue-count" id="count-unlocated">0</span>
          </button>
          <button class="queue-item" data-filter="unintelligible">
            <span>Unhearable</span><span class="queue-count" id="count-unintelligible">0</span>
          </button>
          <button class="queue-item" data-filter="disputed">
            <span>Disputed</span><span class="queue-count" id="count-disputed">0</span>
          </button>
        </nav>
      </div>

      <div>
        <div class="rail-section-title">Districts</div>
        <div class="district-totals" id="district-totals">
          <div class="district-row" style="color:var(--silt); font-size:12px;">
            <span>No data yet</span>
          </div>
        </div>
      </div>

      <button class="btn-export" id="btn-export-hxl" onclick="exportHXL()">
        ↓ Export HXL CSV
      </button>
    </aside>

    <!-- Map container (UI-UX §6.4) -->
    <main class="map-container">
      <div id="map"></div>

      <!-- Glass filter bar (chip logic in FE-05, structure here) -->
      <div class="filter-bar" id="filter-bar">
        <span class="filter-chip selected" data-urgency="all">All</span>
        <span class="filter-chip" data-urgency="critical">Critical</span>
        <span class="filter-chip" data-urgency="high">High</span>
        <span class="filter-chip" data-urgency="moderate">Moderate</span>
        <span class="filter-chip" data-urgency="info">Info</span>
        <!-- TODO(FE-05): district + time-window chips -->
      </div>

      <!-- Map legend (glass card) -->
      <div class="map-legend">
        <div class="legend-item"><span class="legend-pin solid"></span> Confirmed</div>
        <div class="legend-item"><span class="legend-pin hollow"></span> Unconfirmed</div>
        <div class="legend-item"><span class="legend-pin disputed"></span> Disputed</div>
        <div class="legend-item"><span class="legend-pin none"></span> Unlocated</div>
      </div>
    </main>

    <!-- Right rail / ticket stream -->
    <section class="rail-stream" id="ticket-stream">
      <div class="stream-header">
        <span class="rail-section-title" style="margin:0">Ticket Stream</span>
        <span class="stream-count" id="stream-count">0 tickets</span>
      </div>
      <!-- FE-11: status cards live in their own container so they survive ticket filter rebuilds -->
      <div class="status-stack" id="status-stack"></div>
      <!-- Ticket cards are rendered here; cleared on filter changes -->
      <div class="ticket-list" id="ticket-list">
        <div class="empty-state" id="empty-state">
          <div class="empty-glyph">
            <span style="height:8px"></span><span style="height:18px"></span>
            <span style="height:28px"></span><span style="height:20px"></span>
            <span style="height:12px"></span><span style="height:6px"></span>
          </div>
          <div class="empty-title">Listening.</div>
          <div class="empty-sub">Messages sent to the triage number will appear here within seconds.</div>
        </div>
      </div>
    </section>
  </div>

  <!-- FE-07: Detail drawer + scrim (UI-UX §6.5) -->
  <!-- Mounted outside app-shell so it overlays the full viewport -->
  <div class="drawer-scrim" id="drawer-scrim"></div>
  <aside class="detail-drawer" id="detail-drawer" role="dialog" aria-label="Ticket detail" tabindex="-1">
    <!-- Content injected by _renderDrawerContent() in app.js -->
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Module load order: map → tickets → filters → drawer → stream → app (boot) -->
  <script src="map.js?v=2"></script>
  <script src="tickets.js?v=2"></script>
  <script src="filters.js?v=2"></script>
  <script src="drawer.js?v=2"></script>
  <script src="stream.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>

# Render Blueprint — deploys all three runtimes plus a managed Postgres.
# Reference: https://render.com/docs/blueprint-spec
#
# `render new` (or "New +" -> "Blueprint" in the Render dashboard) reading
# this file provisions:
#   nidaa-db          managed Postgres (free tier)
#   nidaa-core        FastAPI pipeline + API      (core/)
#   nidaa-ingest      WhatsApp/Green API daemon    (ingest/)
#   nidaa-dashboard   static dispatcher console    (dashboard/)
#
# Read the "Deploying to Render" section in README.md before running this --
# in particular, nidaa-ingest's free-tier spin-down behaviour (it's a
# background poller, not a request/response service) needs either a paid
# instance type or an external keepalive ping; this file defaults to free
# and documents the tradeoff inline below.
#
# Secrets (GROQ_API_KEY, GREEN_API_ID_INSTANCE, GREEN_API_TOKEN,
# SENDER_HASH_SALT) are marked `sync: false` -- Render prompts for these once
# during Blueprint creation and never stores them in this file or git.

databases:
  - name: nidaa-db
    plan: free
    databaseName: nidaa
    user: nidaa

services:
  - type: web
    name: nidaa-core
    runtime: python
    plan: free
    rootDir: ./core
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nidaa-db
          property: connectionString
      - key: DEMO_MODE
        value: "false"
      # Public URL, not fromService/private-network: tried that first, but
      # Render's private network requires BOTH sides to be able to receive
      # private traffic, and free-tier web services can only *send* it, not
      # receive it (confirmed after nidaa-ingest's first real message failed
      # with getaddrinfo ENOTFOUND trying to reach nidaa-core privately) --
      # a hard free-tier limitation, not something fixable in this file.
      # nidaa-ingest's own public URL has been stable across every deploy so
      # far (no subdomain-collision suffix, unlike nidaa-core), so this one
      # is safe to hardcode.
      - key: INGEST_URL
        value: https://nidaa-ingest.onrender.com
      - key: STT_MODEL_PRIMARY
        value: whisper-large-v3-turbo
      - key: STT_MODEL_ESCALATION
        value: whisper-large-v3
      - key: LLM_MODEL_PRIMARY
        value: openai/gpt-oss-120b
      - key: LLM_MODEL_FALLBACK
        value: qwen/qwen3.6-27b
      - key: STT_RATE_LIMIT_RPM
        value: "15"
      - key: LLM_RATE_LIMIT_RPM
        value: "25"
      - key: WORKER_CONCURRENCY
        value: "6"
      - key: AUDIO_TTL_HOURS
        value: "72"
    # No persistent disk by default: free-tier web services don't support
    # one, and storage/audio/ resetting on restart/redeploy is consistent
    # with this project's own 72h audio-retention design (docs/TRD.md 3.1),
    # not a new gap. If you upgrade to a paid instance type and want audio
    # to survive restarts, uncomment:
    # disk:
    #   name: nidaa-core-audio
    #   mountPath: /opt/render/project/src/storage
    #   sizeGB: 1

  - type: web
    name: nidaa-ingest
    runtime: node
    plan: free
    rootDir: ./ingest
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      # Public URL, not fromService: free-tier services can't receive
      # private-network traffic (see nidaa-core's INGEST_URL comment above
      # for what that broke). nidaa-core's public URL got an unpredictable
      # suffix on a name collision, so unlike INGEST_URL below this can't be
      # hardcoded reliably -- set it manually once (like GREEN_API_TOKEN
      # etc.), same value as nidaa-dashboard's NIDAA_CORE_PUBLIC_URL.
      - key: CORE_URL
        sync: false
      - key: INGEST_URL
        value: https://nidaa-ingest.onrender.com
      # greenapi (HTTP polling) is the Render-deployable transport -- it
      # needs no persistent local auth state, unlike Baileys' direct-socket
      # pairing (useMultiFileAuthState), which won't survive this service's
      # ephemeral disk. Keep INGEST_TRANSPORT=greenapi here.
      - key: INGEST_TRANSPORT
        value: greenapi
      - key: GREEN_API_ID_INSTANCE
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: SENDER_HASH_SALT
        sync: false

  - type: web
    name: nidaa-dashboard
    runtime: static
    rootDir: ./dashboard
    # Overwrites the checked-in placeholder config.js with the real deployed
    # core URL before publishing -- no bundler, no npm dependency graph,
    # dashboard/ still opens from file:// unmodified for local dev
    # (dashboard/CLAUDE.md's "no build step" rule is about local dev tooling,
    # not what Render's own deploy step is allowed to do).
    #
    # NIDAA_CORE_PUBLIC_URL is set manually below (like the other secrets),
    # not via fromService: the dashboard runs in the visitor's browser, which
    # needs core's real public https://...onrender.com URL -- fromService
    # only resolves Render's *private*-network host:port, unreachable from a
    # browser. After nidaa-core's first deploy, copy its actual public URL
    # (Render may have appended a suffix on a name collision -- check the
    # nidaa-core service page) into this env var, then manually redeploy
    # nidaa-dashboard once.
    buildCommand: echo "window.NIDAA_CORE_URL = \"$NIDAA_CORE_PUBLIC_URL\";" > config.js
    staticPublishPath: .
    envVars:
      - key: NIDAA_CORE_PUBLIC_URL
        sync: false
